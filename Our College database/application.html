<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diploma College Application Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#e8ecef,#ffffff,#d6eaf8);
    padding:30px;
}

.container{
    max-width:800px;
    margin:auto;
    background:#ffffff;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    overflow:hidden;
}

.header{
    background:linear-gradient(90deg,#5d6d7e,#3498db,#85c1e9);
    color:white;
    text-align:center;
    padding:20px;
}

.header h1{
    font-size:30px;
}

.header p{
    margin-top:5px;
}

form{
    padding:25px;
}

.section{
    background:#f4f6f7;
    color:#2c3e50;
    padding:10px;
    margin:20px 0 15px;
    border-left:6px solid #3498db;
    font-weight:bold;
    border-radius:5px;
}

table{
    width:100%;
}

td{
    padding:10px;
}

label{
    font-weight:bold;
    color:#34495e;
}

input,select,textarea{
    width:100%;
    padding:10px;
    border:1px solid #bfc9ca;
    border-radius:6px;
}

textarea{
    resize:none;
}

.submit{
    text-align:center;
    margin-top:20px;
}

button{
    background:#3498db;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#2874a6;
}
</style>

</head>
<body>

<div class="container">

<div class="header">
<h1>DIPLOMA COLLEGE APPLICATION FORM</h1>
<p>Admission Form</p>
</div>

<form>

<div class="section">Student Information</div>

<table>
<tr>
<td><label>Full Name</label></td>
<td><input type="text"></td>
</tr>

<tr>
<td><label>Father's Name</label></td>
<td><input type="text"></td>
</tr>

<tr>
<td><label>Mother's Name</label></td>
<td><input type="text"></td>
</tr>

<tr>
<td><label>Date of Birth</label></td>
<td><input type="date"></td>
</tr>

<tr>
<td><label>Gender</label></td>
<td>
<select>
<option>Select</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</td>
</tr>

<tr>
<td><label>Mobile Number</label></td>
<td><input type="tel"></td>
</tr>

<tr>
<td><label>Email</label></td>
<td><input type="email"></td>
</tr>

<tr>
<td><label>Address</label></td>
<td><textarea rows="3"></textarea></td>
</tr>
</table>

<div class="section">Academic Details</div>

<table>
<tr>
<td><label>SSLC Register Number</label></td>
<td><input type="text"></td>
</tr>

<tr>
<td><label>Passing Year</label></td>
<td><input type="number"></td>
</tr>

<tr>
<td><label>Percentage</label></td>
<td><input type="text"></td>
</tr>

<tr>
<td><label>College Branch</label></td>
<td>
<select>
<option>Select Branch</option>
<option>Computer Science</option>
<option>Mechanical</option>
<option>Civil</option>
<option>Electrical & Electronics</option>
<option>Electronics & Communication</option>
<option>Food Processing & Preservation</option>
</select>
</td>
</tr>
</table>

<div class="section">Document Upload</div>

<table>
<tr>
<td><label>Passport Size Photo</label></td>
<td><input type="file"></td>
</tr>

<tr>
<td><label>SSLC Marks Card</label></td>
<td><input type="file"></td>
</tr>

<tr>
<td><label>Aadhaar Card</label></td>
<td><input type="file"></td>
</tr>

<tr>
<td><label>Caste Certificate</label></td>
<td><input type="file"></td>
</tr>
</table>

<div class="submit">
<button type="submit">Submit Application</button>
</div>

</form>

</div>

</body>
</html>
